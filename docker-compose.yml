services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "5433:5432"
    volumes:
      - veille_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://veille:veille@db:5432/veille?sslmode=disable
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-15m}
      NOTIFY_INTERVAL: ${NOTIFY_INTERVAL:-1m}
      REMINDER_LEAD: ${REMINDER_LEAD:-24h}
      REMINDER_WINDOW: ${REMINDER_WINDOW:-24h}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      WHATSAPP_TO: ${WHATSAPP_TO}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
    restart: unless-stopped

volumes:
  veille_pg:
